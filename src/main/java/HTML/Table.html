<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A sample employee table with selectable rows and editable dates.">
    <title>Employee Table | Saurav Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f1f5fb;
            --ink: #1f2a44;
            --muted: #65728b;
            --line: #e1e8f2;
            --blue: #3768d9;
            --aqua: #28b8bd;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 10% 0%, #dceaff 0, transparent 36rem),
                radial-gradient(ellipse at 100% 24%, #dff7f2 0, transparent 30rem),
                var(--page-bg);
            color: var(--ink);
            font-family: Arial, sans-serif;
        }

        .topbar {
            position: sticky;
            z-index: 10;
            top: 0;
            display: flex;
            min-height: 72px;
            align-items: center;
            gap: 24px;
            padding: 12px 24px;
            border-bottom: 1px solid #ffffffa6;
            background: #ffffffeb;
            box-shadow: 0 5px 24px #3150800d;
            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            flex: 0 0 220px;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            font-size: 20px;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(140deg, var(--blue), var(--aqua));
            color: #fff;
            font-size: 21px;
            font-weight: 700;
            box-shadow: 0 5px 14px #3768d94d;
        }

        .search-box {
            width: min(720px, 100%);
            border: 1px solid transparent;
            border-radius: 24px;
            background: #f3f6fb;
            padding: 12px 18px;
            transition: background .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .search-box:focus {
            border-color: #9db8f5;
            background: #fff;
            box-shadow: 0 0 0 4px #3768d91c;
            outline: 0;
        }

        .profile {
            display: grid;
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            place-items: center;
            margin-left: auto;
            border-radius: 50%;
            background: linear-gradient(145deg, #d7efff, #d9f4ec);
            color: #2257a8;
            font-weight: 700;
            box-shadow: 0 0 0 4px #3768d914;
        }

        main {
            max-width: 1440px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .table-card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fffffff2;
            box-shadow: 0 18px 50px #28456e14, 0 2px 8px #28456e0a;
            animation: card-enter .55s cubic-bezier(.2, .8, .2, 1) both;
        }

        .table-heading {
            position: relative;
            overflow: hidden;
            padding: 22px 24px 12px;
            background: linear-gradient(115deg, #fff 45%, #f0f7ff);
        }

        .table-heading::after {
            position: absolute;
            top: -50px;
            right: 6%;
            width: 130px;
            height: 130px;
            border: 20px solid #28b8bd12;
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .table-heading h1 {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 500;
        }

        .table-heading p,
        .table-status {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .table-heading h1 {
            color: #23395d;
            font-weight: 700;
            letter-spacing: -.025em;
        }

        .table-toolbar {
            background: #fbfcff;
        }

        .table-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-top: 1px solid #f1f3f4;
            border-bottom: 1px solid var(--line);
        }

        .toolbar-button {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            font-size: 19px;
        }

        .toolbar-button:hover,
        .scroll-button:hover {
            background: #eaf1ff;
            color: var(--blue);
            transform: translateY(-2px);
        }

        .table-status {
            margin-left: auto;
            padding: 0 8px;
            color: var(--blue);
            font-weight: 600;
        }

        .table-scroll {
            max-height: min(62vh, 620px);
            overflow: auto;
            scrollbar-color: #bdc1c6 #f1f3f4;
            scrollbar-width: auto;
        }

        .employee-table {
            min-width: 760px;
            margin: 0;
            --bs-table-striped-bg: #f8faff;
            --bs-table-hover-bg: #edf5ff;
        }

        .employee-table thead {
            position: sticky;
            z-index: 2;
            top: 0;
            background: linear-gradient(#fff, #f8faff);
            box-shadow: 0 1px 0 var(--line);
        }

        .employee-table th {
            color: #566783;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .03em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .employee-table th,
        .employee-table td {
            padding: 12px 16px;
            vertical-align: middle;
        }

        .employee-table tbody tr:hover {
            background: #edf5ff;
        }

        .employee-table tbody tr {
            animation: row-enter .3s ease both;
            transition: background-color .18s ease, box-shadow .18s ease;
        }

        .employee-table tbody tr.is-selected {
            background: #eaf2ff;
            box-shadow: inset 3px 0 0 var(--blue);
        }

        .employee-checkbox {
            accent-color: var(--blue);
            cursor: pointer;
        }

        .employee-table input[type="date"] {
            accent-color: var(--blue);
        }

        .employee-table input[type="date"] {
            min-width: 145px;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--ink);
            padding: 5px;
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .employee-table input[type="date"]:hover,
        .employee-table input[type="date"]:focus {
            border-color: #a9bfef;
            background: #fff;
            box-shadow: 0 0 0 3px #3768d914;
        }

        .scroll-controls {
            position: fixed;
            right: 24px;
            bottom: 24px;
            display: grid;
            gap: 8px;
        }

        .scroll-button {
            width: 44px;
            height: 44px;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: linear-gradient(145deg, #fff, #f0f6ff);
            color: var(--muted);
            box-shadow: 0 1px 4px #20212424;
            font-size: 20px;
            transition: transform .18s ease, box-shadow .18s ease, color .18s ease;
        }

        .scroll-button:hover {
            box-shadow: 0 6px 16px #28456e26;
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes row-enter {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                gap: 12px;
                padding: 10px 14px;
            }

            .brand {
                flex-basis: auto;
                font-size: 0;
            }

            .brand-mark {
                font-size: 21px;
            }

            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            .table-status {
                width: 100%;
                margin: 0;
            }
        }
    </style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="SauravWebsite.html" aria-label="Saurav Lab home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Saurav Lab</span>
    </a>
    <input class="search-box form-control" id="employee-search" type="search"
           placeholder="Search employees" aria-label="Search employees">
    <span class="profile" aria-label="Saurav profile">S</span>
</header>

<main>
    <section class="table-card" aria-labelledby="employee-table-heading">
        <div class="table-heading">
            <h1 id="employee-table-heading">Employee directory</h1>
            <p>50 sample employees. Select rows with the checkboxes; dates can be edited directly.</p>
        </div>
        <div class="table-toolbar" role="toolbar" aria-label="Employee table actions">
            <label class="d-flex align-items-center gap-2 px-2" for="select-all">
                <input class="form-check-input m-0" id="select-all" type="checkbox"
                       aria-label="Select all visible employees">
                <span class="small text-secondary">Select all</span>
            </label>
            <button class="toolbar-button" id="clear-selection" type="button"
                    aria-label="Clear selection" title="Clear selection">×</button>
            <span class="table-status" id="table-status" role="status" aria-live="polite">
                0 selected
            </span>
        </div>
        <div class="table-scroll" id="table-scroll" tabindex="0"
             aria-label="Scrollable employee table">
            <table class="table table-striped employee-table align-middle">
                <thead>
                <tr>
                    <th scope="col"><span class="visually-hidden">Select</span></th>
                    <th scope="col">First name</th>
                    <th scope="col">Last name</th>
                    <th scope="col">Age</th>
                    <th scope="col">Location</th>
                    <th scope="col">Date</th>
                    <th scope="col">Job</th>
                </tr>
                </thead>
                <tbody id="employee-rows"></tbody>
            </table>
        </div>
    </section>
</main>

<div class="scroll-controls" aria-label="Table scroll controls">
    <button class="scroll-button" id="scroll-up" type="button" aria-label="Scroll table up"
            title="Scroll table up">↑</button>
    <button class="scroll-button" id="scroll-down" type="button" aria-label="Scroll table down"
            title="Scroll table down">↓</button>
</div>

<script>
    const firstNames = [
        "Aarav", "Aisha", "Amelia", "Arjun", "Benjamin", "Chloe", "Daniel", "Diya",
        "Ethan", "Fatima", "Grace", "Harper", "Ibrahim", "Isabella", "Jacob", "Jasmine",
        "Kabir", "Liam", "Maya", "Mia", "Nathan", "Noah", "Olivia", "Omar", "Priya",
        "Rohan", "Samuel", "Sofia", "Thea", "Zara"
    ];
    const lastNames = [
        "Adams", "Bennett", "Brown", "Campbell", "Chen", "Clark", "Davis", "Evans",
        "Garcia", "Gupta", "Harris", "Iyer", "Jackson", "Johnson", "Khan", "Kim",
        "Lee", "Martin", "Miller", "Patel", "Roberts", "Shah", "Singh", "Taylor",
        "Thomas", "Walker", "White", "Wilson", "Wong", "Young"
    ];
    const locations = [
        "Bengaluru", "Boston", "Chicago", "Delhi", "Dublin", "London", "Mumbai",
        "New York", "Seattle", "Singapore"
    ];
    const jobs = [
        "Accountant", "Business Analyst", "Customer Support", "Data Analyst",
        "Designer", "Developer", "Engineer", "HR Specialist", "Project Manager",
        "QA Tester"
    ];
    const employeeRows = document.querySelector("#employee-rows");
    const selectAll = document.querySelector("#select-all");
    const tableStatus = document.querySelector("#table-status");
    const tableScroll = document.querySelector("#table-scroll");
    const employees = Array.from({ length: 50 }, (_, index) => ({
        firstName: firstNames[index % firstNames.length],
        lastName: lastNames[(index * 7) % lastNames.length],
        age: 22 + ((index * 3) % 39),
        location: locations[(index * 3) % locations.length],
        date: new Date(Date.UTC(2025, 0, 1 + index)).toISOString().slice(0, 10),
        job: jobs[(index * 7) % jobs.length],
        selected: false
    }));
    let visibleEmployees = employees;

    function renderEmployees(searchTerm = "") {
        const query = searchTerm.trim().toLocaleLowerCase();
        const fragment = document.createDocumentFragment();
        visibleEmployees = employees.filter((person) => {
            const searchableText = [
                person.firstName, person.lastName, person.age, person.location,
                person.date, person.job
            ].join(" ").toLocaleLowerCase();
            return searchableText.includes(query);
        });

        visibleEmployees.forEach((person, rowIndex) => {
            const row = document.createElement("tr");
            row.style.animationDelay = `${Math.min(rowIndex, 12) * 18}ms`;
            row.classList.toggle("is-selected", person.selected);
            const checkboxCell = document.createElement("td");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "form-check-input employee-checkbox";
            checkbox.setAttribute("aria-label", `Select ${person.firstName} ${person.lastName}`);
            checkbox.checked = person.selected;
            checkbox.addEventListener("change", () => {
                person.selected = checkbox.checked;
                row.classList.toggle("is-selected", person.selected);
                updateSelectionStatus();
            });
            row.classList.toggle("is-selected", person.selected);
            checkboxCell.append(checkbox);
            row.append(checkboxCell);

            [person.firstName, person.lastName, String(person.age), person.location]
                .forEach((value) => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.append(cell);
                });

            const dateCell = document.createElement("td");
            const dateInput = document.createElement("input");
            dateInput.type = "date";
            dateInput.value = person.date;
            dateInput.setAttribute("aria-label", `Date for ${person.firstName} ${person.lastName}`);
            dateInput.addEventListener("change", () => {
                person.date = dateInput.value;
            });
            dateCell.append(dateInput);
            row.append(dateCell);

            const jobCell = document.createElement("td");
            jobCell.textContent = person.job;
            row.append(jobCell);
            fragment.append(row);
        });

        employeeRows.replaceChildren(fragment);
        updateSelectionStatus();
        if (visibleEmployees.length === 0) {
            const emptyRow = document.createElement("tr");
            const cell = document.createElement("td");
            cell.colSpan = 7;
            cell.className = "text-center text-secondary py-4";
            cell.textContent = "No employees match your search.";
            emptyRow.append(cell);
            employeeRows.append(emptyRow);
        }
    }

    function getEmployeeCheckboxes() {
        return [...employeeRows.querySelectorAll(".employee-checkbox")];
    }

    function updateSelectionStatus() {
        const checkboxes = getEmployeeCheckboxes();
        const selectedCount = employees.filter((person) => person.selected).length;
        const visibleSelectedCount = visibleEmployees.filter((person) => person.selected).length;
        tableStatus.textContent = `${selectedCount} selected`;
        selectAll.checked = checkboxes.length > 0 && visibleSelectedCount === checkboxes.length;
        selectAll.indeterminate = visibleSelectedCount > 0
            && visibleSelectedCount < checkboxes.length;
    }

    selectAll.addEventListener("change", () => {
        visibleEmployees.forEach((person) => {
            person.selected = selectAll.checked;
        });
        getEmployeeCheckboxes().forEach((checkbox) => {
            checkbox.checked = selectAll.checked;
            checkbox.closest("tr").classList.toggle("is-selected", selectAll.checked);
        });
        updateSelectionStatus();
    });

    document.querySelector("#clear-selection").addEventListener("click", () => {
        employees.forEach((person) => {
            person.selected = false;
        });
        getEmployeeCheckboxes().forEach((checkbox) => {
            checkbox.checked = false;
            checkbox.closest("tr").classList.remove("is-selected");
        });
        updateSelectionStatus();
    });

    document.querySelector("#employee-search").addEventListener("input", (event) => {
        renderEmployees(event.target.value);
    });

    document.querySelector("#scroll-up").addEventListener("click", () => {
        tableScroll.scrollBy({ top: -350, behavior: "smooth" });
    });
    document.querySelector("#scroll-down").addEventListener("click", () => {
        tableScroll.scrollBy({ top: 350, behavior: "smooth" });
    });

    renderEmployees();
</script>
</body>
</html>
